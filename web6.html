<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
<script>
  //JSON = javascript object notation
  //Sirve como interfaz de comunaicación entre sistemas heterogéneos

  //clave: [] Arreglo
  //clave: {} Obejto
  //calve: 
  //clave: 

  const fichaPersonal = {
    apellidos: "De La Cruz Sotelo",
    nombres: "Jesus Rodrigo",
    telefonos: ["999999999", "888888888"],
    locacion: {
      departamento: "Ica",
      provincia: "Chincha",
      distrito: "Suanmpe",
      direccion: "Av. San Antonio 211",
      referencia: null
    }
  }

  //Crear JSON (cadena simple)
  const jsonBasico = `{"carrera": "Ingeniería de software", "ciclo": "IV", "curso": "Seminario I"}`

  //Cobvertir un OBJECT a JSON (cadena de caracteres)
  console.log(JSON.stringify(fichaPersonal))

  //Mostrar el JSON basico
  console.log(jsonBasico)

  //JSON > OBJECT
  console.log(JSON.parse(jsonBasico))

  
</script>  

</body>
</html>
