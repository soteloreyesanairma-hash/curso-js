<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>
  <!-- Formulario realizar cotizacion -->
  <!-- Compra una PC / Portatil -->
  <!-- Existen campos obligatorios / no obligatorios -->
  <!-- Generar un cuadro de dialogo con la informacion -->
  <!-- Aplicar estilos CSS -->
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-half">
          <form action="" id="cotizacion">
            <div class="field">
              <label class="label" for="nombre">Nombres</label>
              <input class="input is-info" type="text" id="nombre" minlength="3" required>
            </div>

            <div class="field">
              <label class="label" for="apellidos">Apellidos</label>
              <input class="input is-info" type="text" id="apellidos" minlength="3" required>
            </div>

            <div class="field">
              <label class="label" for="email">Correo</label>
              <input class="input is-info" type="email" id="email" required>
            </div>

            <div class="field">
              <label class="label" for="tipo">Tipo de computadora</label>
              <div class="select is-info">
                <select name="tipo" id="tipo" required>
                  <option value="">Seleccione tipo de PC</option>
                  <option value="1">PC escritorio</option>
                  <option value="2">PC portatil</option>
              </select>
              </div>
            </div>

            <div class="field">
              <label class="label" for="procesador">Procesador</label>
              <div class="select is-info">
                <select id="procesador" required>
                  <option value="">Seleccione un procesador</option>
                  <option value="1">Intel Core i5</option>
                  <option value="2">Intel Core i7</option>
                  <option value="3">AMD Ryzen 5</option>
                  <option value="4">AMD Ryzen 7</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="label" for="ram">Memoria RAM</label>
              <div class="select is-info">
                <select id="ram" required>
                  <option value="">Seleccione la memoria RAM</option>
                  <option value="1">8 GB</option>
                  <option value="2">16 GB</option>
                  <option value="3">32 GB</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="label" for="comentario">Comentario adicional</label>
              <input class="input is-info" type="text" id="comentario">
            </div>

            <div class="field">
              <button class="button" type="submit">Enviar</button>
              <button class="button" type="reset">Reiniciar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  

  <script>
    const cotizacion = document.getElementById("cotizacion")
    
    cotizacion.addEventListener("submit", function(event){
      event.preventDefault()

      const nombre = document.getElementById("nombre").value
      const apellidos = document.getElementById("apellidos").value
      const email = document.getElementById("email").value
      const tipo = document.getElementById("tipo").value
      const procesador = document.getElementById("procesador").value
      const ram = document.getElementById("ram").value
      const comentario = document.getElementById("comentario").value

      if(confirm("Estas seguro de esta cotizacion")){
        alert("Guardado correctamente")
      }
    })
  </script>

</body>

</html>
