<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    async function obtenerDatos(){
      const API_URL = `https://api.restcountries.com/countries/v5?q=canada`

      try{
        const respuesta = await fetch(API_URL, {
          headers: { 'Authorization': 'Bearer rc_live_71bdfd6c49d046afafdef2a88c90bd99' }
        })

        if(!respuesta.ok){
          throw new Error(`No es posible conectarse al servidor`)
        }

        const datos = await respuesta.json()
        console.log(datos)
      }catch(e){
        console.error(`No se pudo conectar la operacion: ${e}`)
      }
    }

    obtenerDatos()

  </script>
</body>
</html>
