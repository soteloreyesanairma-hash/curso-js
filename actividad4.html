<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <!-- Construir un cuestionario -->
  <!-- pregunta -->
  <!-- 3 alternativas -->
  <!-- Utilizar botones de desplazamiento para la navegacion  -->
  <!-- Los datos que se iran mostrando deben estar en un objeto  -->
  
  <h1>Cuestionario sobre Programacion</h1>
  <div id="pregunta"></div>
  <div id="alternativa"></div>

  <div>
    <button type="button" id="anterior">Anterior</button>
    <button type="button" id="siguiente">Siguiente</button>
  </div>

  <script>
    const cuestionario = {
      titulo : "Evaluacion de Programacion",
      nivel : "Facil",
      contenido : [
        { pregunta: "¿Que es una variable en programacion", 
        alternativas:["Un espacio en memoria que guarda un valor", "Un tipo de bucle", "Un error del programa"]},
        
        { pregunta: "¿Para que sirve la funcion print o imprimir",
        alternativas:["Para mostrar informacion en pantalla", "Para borrar archivos", "Para crear variables"]},
        
        { pregunta: "¿Que es un bucle", 
        alternativas:["Una estructura que repite instrucciones", "Un tipo de texto", "Una base de datos"]},
        
        { pregunta: "¿Que es un condicional", 
        alternativas:["Una estructura que decide que codigo ejecutar", "Un numero decimal", "Un tipo de archivo"]},
        
        { pregunta: "¿Que es un string", 
        alternativas: ["Un texto o cadena de caracteres", "Un numero entero", "Un valor verdadero o falso"]}
      ]
    }

    const pregunta = document.getElementById("pregunta")
    const alternativa = document.getElementById("alternativa")
    const anterior = document.getElementById("anterior")
    const siguiente = document.getElementById("siguiente")

    let indice = 0

    pregunta.innerHTML = cuestionario.contenido[indice].pregunta
    let texto = ""
    for(let i = 0; i < 3; i++){
      texto = texto + `<div><input type ="radio" name="op"> 
        ${cuestionario.contenido[indice].alternativas[i]}</div>`
    }
    alternativa.innerHTML = texto

    siguiente.addEventListener("click", function(){
      if(indice < cuestionario.contenido.length - 1){
        indice = indice + 1
        pregunta.innerHTML = cuestionario.contenido[indice].pregunta
        let texto = ""
        for(let i = 0; i < 3; i++){
          texto = texto + `<div><input type ="radio" name="op"> 
            ${cuestionario.contenido[indice].alternativas[i]}</div>`
        }
        alternativa.innerHTML = texto
      }
    })

    anterior.addEventListener("click", function(){
      if(indice > 0){
        indice = indice - 1
        pregunta.innerHTML = cuestionario.contenido[indice].pregunta
        let texto = ""
        for(let i = 0; i < 3; i++){
          texto = texto + `<div><input type ="radio" name="op"> 
            ${cuestionario.contenido[indice].alternativas[i]}</div>`
        }
        alternativa.innerHTML = texto
      }
    })

  </script>
</body>
</html>
